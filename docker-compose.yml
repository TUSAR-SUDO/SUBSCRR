services:
  backend:
    build: ./backend
    container_name: subscrr-api
    environment:
      NODE_ENV: production
      PORT: 5000
      # REQUIRED: generate with: node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env or your environment}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env or your environment}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DB_PATH: /app/data/subscrr.db
      UPLOAD_DIR: /app/uploads
      # Production Email Provider (Resend or SMTP)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Subscrr <onboarding@resend.dev>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    ports:
      - "5000:5000"
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Browsers call the API directly; point at your public API host in prod.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    container_name: subscrr-web
    environment:
      NODE_ENV: production
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-subscrr-payload-secret-production-change-me}
      PAYLOAD_DATABASE_URI: ${PAYLOAD_DATABASE_URI:-file:/app/content-data/subscrr-content.db}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - frontend-content:/app/content-data
      - frontend-media:/app/media-uploads
    restart: unless-stopped

volumes:
  backend-data:
  backend-uploads:
  frontend-content:
  frontend-media:
