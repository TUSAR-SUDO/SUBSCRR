name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + integration tests (isolated test DB)
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test — boot server, hit /api/health
        run: |
          npm run build
          PORT=5099 NODE_ENV=production JWT_SECRET=ci-secret-ci-secret-ci-secret-123456 DB_PATH=./data/ci-smoke.db node dist/server.js &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5099/api/health > /dev/null; then
              echo "Health check passed"; exit 0
            fi
            sleep 1
          done
          echo "Server failed to become healthy"; exit 1

  frontend:
    name: Frontend — typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t subscrr-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t subscrr-frontend:ci ./frontend
